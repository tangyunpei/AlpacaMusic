name: CI

# Pull requests run only the quick build script tests. The full macOS checks
# (Swift tests, compiler-extracted translations and the SDK audit) run locally
# with scripts/check-all.sh, or here on demand from the Actions tab.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-script-tests:
    name: Build script tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test version and publication logic
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py'
      - name: Check localization resources
        run: python3 scripts/check-localizations.py

  swift-tests:
    name: Swift tests and SDK audit
    if: github.event_name == 'workflow_dispatch'
    runs-on: xcode-27
    timeout-minutes: 35
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run every check
        run: ./scripts/check-all.sh
